type RequestExecutionSelection {
  clientTransport: String!
  upstreamTransport: String!
  transportFallbackReason: String!
  channelName: String!
  provider: String!
  keyHint: String!
  keyRemark: String!
  sessionState: String!
  strategy: String!
  priority: Int!
  candidates: [RequestRoutingCandidate!]!
}

type RequestRoutingCandidate {
  channelID: Int!
  channelName: String!
  provider: String!
  priority: Int!
  models: [String!]!
  sessionReuse: Boolean!
}

type RequestExecutionFailure {
  source: String!
  code: String!
  type: String!
  body: String!
  bodyTruncated: Boolean!
}

type RequestFailure {
  stage: String!
  code: String!
  type: String!
  message: String!
}

input RequestLogTimeRangeInput {
  period: ConsumptionPeriod!
  "Wall-clock date and time in the configured reporting timezone."
  start: String
  end: String
}

input RequestLogFilterInput {
  "Show the final request of a verified client-cancellation continuation chain. Filters and counts apply to that representative."
  collapseContinuations: Boolean = false
  "Skip this many matching requests for page navigation; cannot be combined with cursors."
  offset: Int
  channelTagsIn: [String!]
  "Match the channel displayed in the request log."
  channelIDsIn: [ID!]
  apiKeyGroupRefsIn: [Int!]
  timeRange: RequestLogTimeRangeInput
}

type RequestLogStatusCount {
  status: RequestStatus!
  count: Int!
}

type RequestSessionExecution {
  id: ID!
  channel: Channel
  selection: RequestExecutionSelection
  costSnapshot: RequestCostSnapshot
}

type RequestResultExecution {
  id: ID!
  responseStatusCode: Int
}

extend type Request {
  "Number of canceled requests immediately preceding this request in the same explicit client turn."
  continuationCount: Int! @goField(forceResolver: true)
  "Last execution dispatched for the session history of a finished request."
  sessionExecution: RequestSessionExecution @goField(forceResolver: true)
  "Identifiable result execution. Its HTTP status is separate from the recorded client status."
  resultExecution: RequestResultExecution @goField(forceResolver: true)
}

extend type Query {
  "Original canceled requests folded into this request, newest first. Original detail access remains unchanged."
  requestContinuations(requestID: ID!, first: Int, after: Cursor): RequestConnection!
  requestLogTimezone: String!
  requestLogStatusCounts(where: RequestWhereInput, filter: RequestLogFilterInput): [RequestLogStatusCount!]!
  requestLogs(after: Cursor, first: Int, before: Cursor, last: Int, orderBy: RequestOrder, where: RequestWhereInput, filter: RequestLogFilterInput): RequestConnection!
}
