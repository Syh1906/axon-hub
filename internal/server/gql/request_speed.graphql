extend type Request {
  outputBatches: RequestOutputBatches @goField(forceResolver: true)
  outputRate: RequestOutputRate @goField(forceResolver: true)
  outputTokensPerSecond: Float @goField(forceResolver: true)
  costRecalculationPreview: CostRecalculationPreview! @goField(forceResolver: true)
}

type CostRecalculationPreview {
  recordedCost: Float
  proposedCost: Float
  pricedAt: Time
  reason: String!
  images: [ImageOutput!]!
}
