schema:
  - selfusage.graphql
  - ../budget_types.graphql

omit_gqlgen_version_in_file_notice: true

exec:
  filename: generated.go
  package: selfusage

model:
  filename: models_gen.go
  package: selfusage

resolver:
  layout: follow-schema
  dir: .
  package: selfusage

autobind:
  - github.com/99designs/gqlgen/graphql/introspection

models:
  SelfUsageImageOutput:
    model: github.com/looplj/axonhub/internal/objects.ImageOutput
  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time
  BudgetPeriod:
    model:
      - github.com/looplj/axonhub/internal/pkg/budget.Period
  BudgetMode:
    model:
      - github.com/looplj/axonhub/internal/pkg/budget.Mode
  BudgetRule:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetRuleInput
  BudgetRuleInput:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetRuleInput
  BudgetSettingsInput:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetSettingsInput
  BudgetResetInput:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetResetInput
  BudgetWindow:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetWindowView
  BudgetView:
    model:
      - github.com/looplj/axonhub/internal/server/biz.BudgetView
