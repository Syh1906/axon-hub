type TierCost {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

type CostItem {
  pricingEvidence: CostPricingEvidence
  image: ImageOutput
  imageRule: String!
  unpriced: Boolean!
  unpricedReason: String!
  itemCode: PriceItemCode!
  promptWriteCacheVariantCode: PromptWriteCacheVariantCode @goField(forceResolver: true)
  quantity: Int!
  tierBreakdown: [TierCost!]
  subtotal: Decimal!
}

input TierCostInput {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

input CostItemInput {
  image: ImageOutputInput
  imageRule: String
  unpriced: Boolean
  unpricedReason: String
  itemCode: PriceItemCode!
  quantity: Int!
  tierBreakdown: [TierCostInput!]
  subtotal: Decimal!
}

type ImageOutput {
  requestedWidth: Int!
  requestedHeight: Int!
  inspectionError: String!
	 tierSource: String!
  width: Int!
  height: Int!
  tier: String!
  source: String!
}
input ImageOutputInput {
  requestedWidth: Int
  requestedHeight: Int
  inspectionError: String
	 tierSource: String
  width: Int!
  height: Int!
  tier: String!
  source: String!
}
