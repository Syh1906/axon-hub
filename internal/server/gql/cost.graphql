type TierCost {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

type CostItem {
  pricingEvidence: CostPricingEvidence
  image: ImageOutput
  imageRule: String!
  unpriced: Boolean!
  itemCode: PriceItemCode!
  promptWriteCacheVariantCode: PromptWriteCacheVariantCode @goField(forceResolver: true)
  quantity: Int!
  tierBreakdown: [TierCost!]
  subtotal: Decimal!
}

input TierCostInput {
  upTo: Int
  units: Int!
  subtotal: Decimal!
}

input CostItemInput {
  image: ImageOutputInput
  imageRule: String
  unpriced: Boolean
  itemCode: PriceItemCode!
  quantity: Int!
  tierBreakdown: [TierCostInput!]
  subtotal: Decimal!
}

type ImageOutput {
	 tierSource: String!
  width: Int!
  height: Int!
  tier: String!
  source: String!
}
input ImageOutputInput {
	 tierSource: String
  width: Int!
  height: Int!
  tier: String!
  source: String!
}
