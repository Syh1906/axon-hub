enum ConsumptionDimension {
  USER
  API_KEY
  API_KEY_GROUP
  CHANNEL
  MODEL
}

enum ConsumptionMetric {
  COST
  CACHE
}

enum ConsumptionPeriod {
  TODAY
  YESTERDAY
  WEEK
  MONTH
  ALL
  CUSTOM
}

input ConsumptionFilter {
  groupRef: Int
  projectID: ID
  dimension: ConsumptionDimension!
  metric: ConsumptionMetric! = COST
  period: ConsumptionPeriod! = TODAY
  startDate: String
  endDate: String
  search: String
}

type ConsumptionProject {
  id: ID!
  name: String!
}

type ConsumptionGroupOption {
  id: ID!
  name: String!
}

type ConsumptionMetrics {
  pricedCost: Float!
  tokenPricedCost: Float!
  pricedTokens: Int!
  successCount: Int!
  outcomeCount: Int!
  firstTokenSum: Float!
  firstTokenCount: Int!
  speedSum: Float!
  coefficientSamples: Int!
  coefficientEligible: Int!
  coefficientTheoretical: Int!
  coefficientObserved: Int!
  requestCount: Int!
  totalTokens: Int!
  totalCost: Float!
  unpricedRequestCount: Int!
  pricedRequestCount: Int!
  tokenPricedRequestCount: Int!
  speedSampleCount: Int!
  cacheRequests: Int!
  cacheReadTokens: Int!
  cacheInputTokens: Int!
  cacheCreationCost: Float!
  cacheHitRate: Float
  successRate: Float
  avgFirstTokenMs: Float
  avgTokensPerSecond: Float
  avgCostPerRequest: Float
  avgCostPerMillionTokens: Float
  cacheCoefficient: Int
}

type ConsumptionSlicePage {
  days: [ConsumptionSliceRevision!]!
  pending: Boolean!
  resolvedAt: Time!
  slices: [ConsumptionResult!]!
  next: Time
  rangeStart: Time
  rangeEnd: Time!
  timezone: String!
  currencyCode: String!
}

type ConsumptionSliceRevision { start: Time! revision: String! }
input ConsumptionSliceRevisionInput { start: Time! revision: String! }
type ConsumptionCacheSample {
  channelID: ID!
  model: String!
  samples: Int!
  eligible: Int!
  theoretical: Int!
  observed: Int!
}
type ConsumptionPerformanceSample {
  channelID: ID!
  name: String!
  model: String!
  metrics: ConsumptionMetrics!
}

type ConsumptionModel {
  model: String!
  metrics: ConsumptionMetrics!
}

type ConsumptionEntry {
  channelRemark: String!
  channelProvider: String!
  channelTags: [String!]!
  duplicateName: Boolean!
  id: ID!
  name: String!
  metrics: ConsumptionMetrics!
  models: [ConsumptionModel!]!
}

type ConsumptionResult {
  revision: String!
  cacheSamples: [ConsumptionCacheSample!]!
  performanceSamples: [ConsumptionPerformanceSample!]!
  resolvedAt: Time!
  entries: [ConsumptionEntry!]!
  modelEntries: [ConsumptionModel!]!
  generatedAt: Time!
  rangeStart: Time
  rangeEnd: Time!
  timezone: String!
  currencyCode: String!
}

extend type Query {
  consumptionSlices(input: ConsumptionFilter!, after: Time, known: [ConsumptionSliceRevisionInput!], asOf: Time, verify: Boolean! = false): ConsumptionSlicePage!
  usageSlices(input: ConsumptionFilter!, after: Time, known: [ConsumptionSliceRevisionInput!], asOf: Time, verify: Boolean! = false): ConsumptionSlicePage!
  consumptionProjects: [ConsumptionProject!]!
  consumptionGroupOptions(input: ConsumptionFilter!): [ConsumptionGroupOption!]!
  usageGroupOptions(input: ConsumptionFilter!): [ConsumptionGroupOption!]!
  consumptionLeaderboard(input: ConsumptionFilter!): ConsumptionResult!
  usageStatistics(input: ConsumptionFilter!): ConsumptionResult!
}
