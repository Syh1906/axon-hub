type ChannelTodayUsage {
  channelId: ID!
  requestCount: Int!
  unpricedCount: Int!
  totalCost: Float!
  timezone: String!
  currencyCode: String!
}

extend type Query {
  channelTodayUsage(channelIds: [ID!]!): [ChannelTodayUsage!]!
  channelTodayUsageDetails(channelId: ID!): ChannelTodayUsageDetails!
}

type ChannelTodayUsageDetails {
  channelId: ID!
  timezone: String!
  currencyCode: String!
  models: [ChannelTodayModelUsage!]!
}

type ChannelTodayModelUsage {
  model: String!
  requestCount: Int!
  unpricedCount: Int!
  totalTokens: Int!
  totalCost: Float!
  cacheHitRate: Float
  standardCost: Float
  standardUnpricedCount: Int!
  avgCostPerMillionTokens: Float
  tokenPricedRequestCount: Int!
}
