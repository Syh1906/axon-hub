# Enum types
enum PricingMode {
	image_fixed
  flat_fee
  usage_per_unit
  usage_tiered
  usage_volume
}

enum PriceItemCode {
  prompt_tokens
  completion_tokens
  prompt_cached_tokens
  prompt_write_cached_tokens
}

enum PromptWriteCacheVariantCode {
  five_min
  one_hour
}

# ModelPrice represents pricing configuration for a model
type ModelPrice {
  serviceTiers: ServiceTierPrices
  multiplier: Decimal
  items: [ModelPriceItem!]!
  volumeTiers: [ModelPriceVolumeTier!]
  schedule: PriceSchedule
}

type ModelPriceVolumeTier {
  serviceTiers: ServiceTierPrices
  longContext: Boolean!
  above: Int!
  items: [ModelPriceItem!]!
}

type ModelPriceItem {
  itemCode: PriceItemCode!
  pricing: Pricing!
  promptWriteCacheVariants: [PromptWriteCacheVariant!]
}

# Time-based price schedule
type PriceSchedule {
  timezone: String!
  overrides: [PriceOverride!]!
}

type PriceOverride {
  serviceTiers: ServiceTierPrices
  name: String!
  priority: Int!
  when: OverrideWhen!
  items: [ModelPriceItem!]!
}

type OverrideWhen {
  dailyTime: DailyTimeRange
  weekdays: [Int!]
  dateRange: DateRange
}

type DailyTimeRange {
  start: String!
  end: String!
}

type DateRange {
  start: String!
  end: String!
}

type Pricing {
	image: ImagePricing
  mode: PricingMode!
  flatFee: Decimal
  usagePerUnit: Decimal
  usageTiered: TieredPricing
}

type TieredPricing {
  tiers: [PriceTier!]!
}

type PriceTier {
  upTo: Int
  pricePerUnit: Decimal!
}

type PromptWriteCacheVariant {
  variantCode: PromptWriteCacheVariantCode!
  pricing: Pricing!
}

# Input types for ModelPrice
input ModelPriceInput {
  serviceTiers: ServiceTierPricesInput
  items: [ModelPriceItemInput!]!
  volumeTiers: [ModelPriceVolumeTierInput!]
  schedule: PriceScheduleInput
}

input ModelPriceVolumeTierInput {
  serviceTiers: ServiceTierPricesInput
  longContext: Boolean = false
  above: Int!
  items: [ModelPriceItemInput!]!
}

input ModelPriceItemInput {
  itemCode: PriceItemCode!
  pricing: PricingInput!
  promptWriteCacheVariants: [PromptWriteCacheVariantInput!]
}

# Input types for time-based price schedule
input PriceScheduleInput {
  timezone: String!
  overrides: [PriceOverrideInput!]!
}

input PriceOverrideInput {
  serviceTiers: ServiceTierPricesInput
  name: String!
  priority: Int!
  when: OverrideWhenInput!
  items: [ModelPriceItemInput!]!
}

input OverrideWhenInput {
  dailyTime: DailyTimeRangeInput
  weekdays: [Int!]
  dateRange: DateRangeInput
}

input DailyTimeRangeInput {
  start: String!
  end: String!
}

input DateRangeInput {
  start: String!
  end: String!
}

input PricingInput {
	image: ImagePricingInput
  mode: PricingMode!
  flatFee: Decimal
  usagePerUnit: Decimal
  usageTiered: TieredPricingInput
}

input TieredPricingInput {
  tiers: [PriceTierInput!]!
}

input PriceTierInput {
  upTo: Int
  pricePerUnit: Decimal!
}

input PromptWriteCacheVariantInput {
  variantCode: PromptWriteCacheVariantCode!
  pricing: PricingInput!
}

input SaveChannelModelPriceInput {
  modelId: String!
  price: ModelPriceInput!
}

extend type Mutation {
  saveChannelModelPrices(channelId: ID!, input: [SaveChannelModelPriceInput!]!, multiplier: Decimal, serviceTierBilling: ServiceTierSettingsInput): [ChannelModelPrice!]!
}

type ImagePricing {
  automatic: Boolean!
  rules: [ImagePriceRule!]!
  savedRules: [ImagePriceRuleDraft!]
}
input ImagePricingInput {
  automatic: Boolean! = true
  rules: [ImagePriceRuleInput!]!
  savedRules: [ImagePriceRuleDraftInput!]
}
type ImagePriceRuleDraft {
  name: String!
  fee: String!
  match: String!
  conditions: [ImageConditionDraft!]
}
input ImagePriceRuleDraftInput {
  name: String!
  fee: String!
  match: String!
  conditions: [ImageConditionDraftInput!]
}
type ImageConditionDraft {
  dimension: String!
  operator: String!
  value: Float!
}
input ImageConditionDraftInput {
  dimension: String!
  operator: String!
  value: Float!
}
type ImagePriceRule {
  name: String!
  fee: Decimal!
  match: String!
  conditions: [ImageCondition!]
}
input ImagePriceRuleInput {
  name: String!
  fee: Decimal!
  match: String!
  conditions: [ImageConditionInput!]
}
type ImageCondition {
  dimension: String!
  operator: String!
  value: Int!
}
input ImageConditionInput {
  dimension: String!
  operator: String!
  value: Int!
}
