type APIKeyGroupOption {
  id: Int!
  name: String!
  projectID: Int!
}

extend type APIKey {
  groupName: String
  displayName: String!
}

extend type Query {
  apiKeyGroupOptions: [APIKeyGroupOption!]!
}

extend type Mutation {
  deleteAPIKeys(ids: [ID!]!): Boolean!
  saveAPIKeyGroup(id: Int, name: String!): APIKeyGroupOption!
  deleteAPIKeyGroup(id: Int!): Boolean!
}
