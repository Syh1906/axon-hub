name: 发布自维护版本

on:
  push:
    tags:
      - 'v*-fork.*.syh.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: 核对发布来源与版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      image: ${{ steps.release.outputs.image }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      publish_binaries: ${{ steps.release.outputs.publish_binaries }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: 验证发布版本、分支和上游基线
        id: release
        run: node scripts/release/release.mjs prepare
      - name: 拒绝覆盖已正式发布的版本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published.txt"
          if grep -Fxq "$VERSION" "$RUNNER_TEMP/published.txt"; then
            echo '该版本已经发布，必须使用新版本号。' >&2
            exit 1
          fi

  checks:
    name: 发布前测试
    needs: prepare
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  docker:
    name: 发布镜像
    needs: [prepare, checks]
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      image: ${{ needs.prepare.outputs.image }}

  release:
    name: 验证镜像并发布版本清单
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: axonhub
          POSTGRES_DB: axonhub
          POSTGRES_PASSWORD: release-test-only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U axonhub -d axonhub"
          --health-interval 5s --health-timeout 5s --health-retries 12
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 验证发布镜像启动
        run: |
          trap 'docker rm -f axonhub-release-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name axonhub-release-smoke -p 127.0.0.1:18090:8090 \
            --add-host host.docker.internal:host-gateway \
            -e AXONHUB_DB_DIALECT=postgres \
            -e 'AXONHUB_DB_DSN=postgres://axonhub:release-test-only@host.docker.internal:15432/axonhub?sslmode=disable' \
            "$IMAGE@$IMAGE_DIGEST"
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18090/health >/dev/null; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs axonhub-release-smoke; exit 1; fi
          docker exec axonhub-release-smoke /app/axonhub version | grep -F "$VERSION"
      - uses: pnpm/action-setup@v6
        if: needs.prepare.outputs.publish_binaries == 'true'
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
        if: needs.prepare.outputs.publish_binaries == 'true'
        working-directory: frontend
      - uses: actions/setup-go@v7
        if: needs.prepare.outputs.publish_binaries == 'true'
        with:
          go-version-file: go.mod
          cache: true
      - name: 写入发布版本
        if: needs.prepare.outputs.publish_binaries == 'true'
        run: printf '%s\n' "$VERSION" > internal/build/VERSION
      - name: 构建二进制包并上传草稿
        if: needs.prepare.outputs.publish_binaries == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 创建仅镜像发布草稿
        if: needs.prepare.outputs.publish_binaries != 'true'
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true) | .tag_name' > "$RUNNER_TEMP/drafts.txt"
          if ! grep -Fxq "$VERSION" "$RUNNER_TEMP/drafts.txt"; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$VERSION" --notes-file .github/release-notes.md
          fi
      - name: 生成并上传部署清单
        run: |
          node scripts/release/release.mjs manifest "$RUNNER_TEMP/release.json"
          gh release upload "$VERSION" "$RUNNER_TEMP/release.json" --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$PRERELEASE" = true ]; then latest=false; else latest=true; fi
          gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" \
            --notes-file .github/release-notes.md --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          echo "已发布 $VERSION：$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
