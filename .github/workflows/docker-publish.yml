name: 构建并发布 GHCR 镜像

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
      image:
        required: true
        type: string
    outputs:
      digest:
        description: 多架构镜像摘要
        value: ${{ jobs.manifest.outputs.digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: 构建 ${{ matrix.arch }} 镜像
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: 写入发布版本
        env:
          VERSION: ${{ inputs.version }}
        run: printf '%s\n' "$VERSION" > internal/build/VERSION
      - uses: docker/setup-buildx-action@v4
      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ inputs.image }}:${{ inputs.version }}-${{ matrix.arch }}
          build-args: BUILD_COMMIT=${{ inputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

  manifest:
    name: 合成多架构镜像
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 合成并记录摘要
        id: manifest
        env:
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
        run: |
          docker buildx imagetools create --metadata-file "$RUNNER_TEMP/manifest.json" \
            -t "$IMAGE:$VERSION" "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          digest=$(jq -er '.["containerimage.descriptor"].digest' "$RUNNER_TEMP/manifest.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
